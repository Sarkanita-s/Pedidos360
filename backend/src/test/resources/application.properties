# Configuracion de Base de Datos H2 en memoria para pruebas unitarias
spring.datasource.url=jdbc:h2:mem:pedidos360_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Mock / disable external auth and connections during basic tests
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://login.microsoftonline.com/common/discovery/keys
spring.rabbitmq.addresses=localhost:5672
spring.kafka.bootstrap-servers=localhost:9092

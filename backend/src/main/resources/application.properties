spring.application.name=backend

# Conexion a PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pedidos360}
spring.datasource.username=${DB_USERNAME:pedidos_user}
spring.datasource.password=${DB_PASSWORD:Pedidos360_2026!}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracion JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Puerto del backend
server.port=${PORT:8080}

# Microsoft Entra ID - token v1.0
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AZURE_JWK_SET_URI:https://login.microsoftonline.com/501361f2-a641-4fba-b6a9-954644204a59/discovery/keys}

# RabbitMQ Cluster Configuration (EP3 / EP4)
spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:localhost:5672,localhost:5673}
spring.rabbitmq.username=${RABBITMQ_USERNAME:pedidos_admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:Pedidos360_Rabbit2026!}
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Apache Kafka Cluster Configuration (3 Brokers - EP5 / EP6)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.enable.idempotence=true

# Kafka Consumer Configuration
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Kafka Topics & Consumer Groups
pedidos360.kafka.topics.orders=pedidos.order.events
pedidos360.kafka.topics.audit=pedidos.audit.events
pedidos360.kafka.groups.orders=pedidos360-order-group
pedidos360.kafka.groups.audit=pedidos360-audit-group

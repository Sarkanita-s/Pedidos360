services:
  rabbit1:
    image: rabbitmq:3.13-management-alpine
    container_name: pedidos360-rabbit1
    hostname: rabbit1
    environment:
      RABBITMQ_ERLANG_COOKIE: "PEDIDOS360_SECRET_COOKIE_2026"
      RABBITMQ_DEFAULT_USER: "pedidos_admin"
      RABBITMQ_DEFAULT_PASS: "Pedidos360_Rabbit2026!"
    volumes:
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    ports:
      - "5672:5672"      # Puerto AMQP Nodo 1
      - "15672:15672"  # Panel RabbitMQ Management Nodo 1
    networks:
      - rabbit-cluster-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 30s

  rabbit2:
    image: rabbitmq:3.13-management-alpine
    container_name: pedidos360-rabbit2
    hostname: rabbit2
    environment:
      RABBITMQ_ERLANG_COOKIE: "PEDIDOS360_SECRET_COOKIE_2026"
      RABBITMQ_DEFAULT_USER: "pedidos_admin"
      RABBITMQ_DEFAULT_PASS: "Pedidos360_Rabbit2026!"
    volumes:
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    ports:
      - "5673:5672"      # Puerto AMQP Nodo 2
      - "15673:15672"  # Panel RabbitMQ Management Nodo 2
    networks:
      - rabbit-cluster-net
    depends_on:
      rabbit1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 30s

networks:
  rabbit-cluster-net:
    driver: bridge

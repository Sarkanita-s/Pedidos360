services:

  # ========================================================
  # RABBITMQ CLUSTER (EP3 / EP4)
  # ========================================================
  rabbit1:
    image: rabbitmq:3.13-management-alpine
    container_name: pedidos360-rabbit1
    hostname: rabbit1
    environment:
      RABBITMQ_ERLANG_COOKIE: "PEDIDOS360_SECRET_COOKIE_2026"
      RABBITMQ_DEFAULT_USER: "pedidos_admin"
      RABBITMQ_DEFAULT_PASS: "Pedidos360_Rabbit2026!"
    volumes:
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    ports:
      - "5672:5672"      # Puerto AMQP Nodo 1
      - "15672:15672"    # Panel RabbitMQ Management Nodo 1
    networks:
      - pedidos360-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 30s

  rabbit2:
    image: rabbitmq:3.13-management-alpine
    container_name: pedidos360-rabbit2
    hostname: rabbit2
    environment:
      RABBITMQ_ERLANG_COOKIE: "PEDIDOS360_SECRET_COOKIE_2026"
      RABBITMQ_DEFAULT_USER: "pedidos_admin"
      RABBITMQ_DEFAULT_PASS: "Pedidos360_Rabbit2026!"
    volumes:
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    ports:
      - "5673:5672"      # Puerto AMQP Nodo 2
      - "15673:15672"    # Panel RabbitMQ Management Nodo 2
    networks:
      - pedidos360-network
    depends_on:
      rabbit1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 30s

  # ========================================================
  # ZOOKEEPER ENSEMBLE (3 NODOS - ACLARACIÓN EP5/EP6)
  # ========================================================
  zookeeper-1:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: pedidos360-zookeeper-1
    hostname: zookeeper-1
    environment:
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_SERVERS: zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888
    ports:
      - "2181:2181"
    networks:
      - pedidos360-network

  zookeeper-2:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: pedidos360-zookeeper-2
    hostname: zookeeper-2
    environment:
      ZOOKEEPER_SERVER_ID: 2
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_SERVERS: zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888
    ports:
      - "2182:2181"
    networks:
      - pedidos360-network

  zookeeper-3:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: pedidos360-zookeeper-3
    hostname: zookeeper-3
    environment:
      ZOOKEEPER_SERVER_ID: 3
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_SERVERS: zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888
    ports:
      - "2183:2181"
    networks:
      - pedidos360-network

  # ========================================================
  # APACHE KAFKA CLUSTER (3 BROKERS - REPLICATION FACTOR = 3)
  # ========================================================
  kafka-1:
    image: confluentinc/cp-kafka:7.5.0
    container_name: pedidos360-kafka-1
    hostname: kafka-1
    depends_on:
      - zookeeper-1
      - zookeeper-2
      - zookeeper-3
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
    networks:
      - pedidos360-network

  kafka-2:
    image: confluentinc/cp-kafka:7.5.0
    container_name: pedidos360-kafka-2
    hostname: kafka-2
    depends_on:
      - zookeeper-1
      - zookeeper-2
      - zookeeper-3
    ports:
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:29093,PLAINTEXT_HOST://localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
    networks:
      - pedidos360-network

  kafka-3:
    image: confluentinc/cp-kafka:7.5.0
    container_name: pedidos360-kafka-3
    hostname: kafka-3
    depends_on:
      - zookeeper-1
      - zookeeper-2
      - zookeeper-3
    ports:
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:29094,PLAINTEXT_HOST://localhost:9094
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
    networks:
      - pedidos360-network

  # ========================================================
  # KAFKA UI (PANEL WEB DE OBSERVABILIDAD)
  # ========================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: pedidos360-kafka-ui
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: pedidos360-kafka-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092,kafka-2:29093,kafka-3:29094
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
      DYNAMIC_CONFIG_ENABLED: "true"
    networks:
      - pedidos360-network

  # ========================================================
  # PROVISIÓN AUTOMÁTICA DE TÓPICOS KAFKA (EP5 / EP6)
  # 2 Tópicos con 3 particiones y factor de replicación 3 + DLT
  # ========================================================
  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: pedidos360-kafka-init
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    entrypoint: [ "/bin/sh", "-c" ]
    command: |
      "
      echo 'Esperando inicialización de brokers Kafka...'
      cub kafka-ready -b kafka-1:29092,kafka-2:29093,kafka-3:29094 3 40

      echo 'Creando tópico 1: pedidos.order.events (3 particiones, RF=3)...'
      kafka-topics --bootstrap-server kafka-1:29092 --create --if-not-exists \
        --topic pedidos.order.events \
        --partitions 3 \
        --replication-factor 3 \
        --config min.insync.replicas=2 \
        --config retention.ms=604800000

      echo 'Creando tópico 2: pedidos.audit.events (3 particiones, RF=3)...'
      kafka-topics --bootstrap-server kafka-1:29092 --create --if-not-exists \
        --topic pedidos.audit.events \
        --partitions 3 \
        --replication-factor 3 \
        --config min.insync.replicas=2 \
        --config retention.ms=604800000

      echo 'Creando Dead Letter Topics (DLT) con RF=3...'
      kafka-topics --bootstrap-server kafka-1:29092 --create --if-not-exists \
        --topic pedidos.order.events.DLT \
        --partitions 3 \
        --replication-factor 3

      kafka-topics --bootstrap-server kafka-1:29092 --create --if-not-exists \
        --topic pedidos.audit.events.DLT \
        --partitions 3 \
        --replication-factor 3

      echo 'Topología de tópicos aprovisionada exitosamente:'
      kafka-topics --bootstrap-server kafka-1:29092 --describe
      "
    networks:
      - pedidos360-network

networks:
  pedidos360-network:
    name: pedidos360-network
    driver: bridge
